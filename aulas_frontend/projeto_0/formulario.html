<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Projeto 0</title>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Página inicial</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Form</h1>
        <form action="form_resultado.html" method="get" target="_blank">
            <label for="nome">Nome:</label><br>
            <input type="text" name="nome" id="nome" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" name="email" id="email" required><br><br>

            <label for="senha">Senha:</label><br>
            <input type="password" name="pass" id="pass" required><br><br>

            <label for="radio_lang">Selecione uma linguagem de programação:</label><br>
            <input type="radio" name="radio_lang" id="lang_py" value="py"> Python <br>
            <input type="radio" name="radio_lang" id="lang_js" value="js"> JavaScript <br>
            <input type="radio" name="radio_lang" id="lang_html" value="html"> HTML <br>
            <input type="radio" name="radio_lang" id="lang_css" value="css3"> CSS 3 <br>

            <br>
            <input type="submit" value="Enviar">
        </form>
    </main>

    <footer>
        <p>footer</p>
    </footer>
</body>

</html>
